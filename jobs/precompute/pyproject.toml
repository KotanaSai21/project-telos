[project]
name = "project-telos-precompute"
version = "0.1.0"
description = "Offline media understanding: synthetic corpus generation, shot detection, and segment maps"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "project-telos-api",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
gemini = ["google-genai>=0.3.0"]
vision = ["google-cloud-vision>=3.7.0"]

[project.scripts]
project-telos-precompute = "project_telos_precompute.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
